<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoVA Deck Builder</title>
<script>try{var t=localStorage.getItem("rova-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>RoVA Deck Builder</h1>
      <p class="sub">Tutorial set · not for release</p>
    </div>
  </div>
  <div class="mode-switch" role="tablist" aria-label="Builder mode">
    <button role="tab" id="tab-summons" aria-selected="true" data-mode="summons">Summons</button>
    <button role="tab" id="tab-tokens" aria-selected="false" data-mode="tokens">Tokens</button>
  </div>
  <div class="top-actions">
    <input id="deck-name" type="text" placeholder="Deck name" aria-label="Deck name" maxlength="60">
    <a class="btn-link" href="sim.html">Playtest</a>
    <button id="btn-theme" class="ghost" aria-label="Theme: auto" title="Theme: auto">Auto</button>
    <button id="btn-import-open">Import</button>
    <button id="btn-export" class="primary">Export</button>
  </div>
</header>

<main class="layout">
  <!-- LEFT: chosen list -->
  <section class="panel chosen" aria-labelledby="chosen-title">
    <div class="panel-head">
      <h2 id="chosen-title">Deck</h2>
      <span id="chosen-total" class="count-pill">0</span>
      <button id="btn-clear" class="ghost danger">Clear</button>
    </div>
    <div id="chosen-stats" class="stats"></div>
    <div id="chosen-list" class="chosen-list"></div>
    <p id="chosen-empty" class="empty">Click a card to add it.</p>
  </section>

  <!-- RIGHT: available pool -->
  <section class="panel pool" aria-labelledby="pool-title">
    <div class="panel-head">
      <h2 id="pool-title">Available</h2>
      <div class="filters">
        <input id="search" type="search" placeholder="Search" aria-label="Search">
        <select id="f-arcana" aria-label="Arcana Type"><option value="">All types</option></select>
        <select id="f-kind" aria-label="Card type"><option value="">All kinds</option></select>
        <select id="f-cost" aria-label="Cost"><option value="">Any cost</option></select>
      </div>
    </div>
    <div id="pool-grid" class="grid"></div>
  </section>
</main>

<!-- Card preview -->
<div id="preview" class="preview" hidden>
  <img id="preview-img" alt="">
</div>

<!-- Export dialog -->
<dialog id="export-dialog">
  <form method="dialog" class="dlg">
    <h2>Export</h2>
    <p class="hint">Copy or print. For a PDF, choose "Save as PDF" when printing.</p>
    <textarea id="export-text" rows="16" readonly></textarea>
    <div class="dlg-actions">
      <button type="button" id="btn-copy" class="primary">Copy list</button>
      <button type="button" id="btn-print-list">Print list</button>
      <button type="button" id="btn-print-proxies">Print proxies</button>
      <button value="close" class="ghost">Close</button>
    </div>
  </form>
</dialog>

<!-- Import dialog -->
<dialog id="import-dialog">
  <form method="dialog" class="dlg">
    <h2>Import</h2>
    <p class="hint">Paste an exported decklist. It replaces the current deck.</p>
    <textarea id="import-text" rows="16"></textarea>
    <div class="dlg-actions">
      <button type="button" id="btn-import" class="primary">Load</button>
      <button value="close" class="ghost">Close</button>
      <span id="import-msg" class="hint"></span>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Print areas -->
<div id="print-list" class="print-only"></div>
<div id="print-proxies" class="print-only"></div>

<script src="app.js?v=11"></script>
</body>
</html>
